<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Visual Explorer</title>
  <style>
    :root { --bg:#0b0d10; --card:#151922; --text:#eaf0ff; --muted:#9fb0d1; --accent:#6ea8fe; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1320px; margin:0 auto; padding:18px; }
    .meta { color:var(--muted); font-size:13px; }
    .panel { background:var(--card); border:1px solid #242d40; border-radius:12px; padding:12px; margin-bottom:12px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .input, select { background:#0f141d; color:var(--text); border:1px solid #2b3448; border-radius:10px; padding:8px 10px; }
    .input { min-width:260px; }
    .btn { border:1px solid #2b3448; background:#0f141d; color:var(--text); border-radius:10px; padding:8px 12px; cursor:pointer; }
    .btn.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; }
    .chip { font-size:11px; background:#0f141d; border:1px solid #2a344b; padding:3px 7px; border-radius:999px; color:#cdd9f7; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid #242d40; border-radius:12px; overflow:hidden; }
    .imgbox { aspect-ratio:1/1; background:#0e1219; }
    img { width:100%; height:100%; object-fit:cover; display:block; }
    .content { padding:9px; }
    .file { font-size:12px; color:#d2ddf7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
    .subtle { color:#8a9bb8; font-size:11px; }
    .text-preview { color:#b8c5e3; font-size:11px; line-height:1.45; margin:6px 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    a { color:var(--accent); text-decoration:none; font-size:12px; }
    @media (max-width: 720px) {
      .wrap { padding:14px; }
      .input { min-width:0; width:100%; }
      .row { align-items:stretch; }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:8px; gap:12px;">
      <h2 style="margin:0">Brand Visual Explorer</h2>
      <a class="btn" style="font-size:13px; text-decoration:none;" href="https://github.com/scarlettbenisen-stack/brand-repo-v2-quotilol-1000-y2024plus/releases/tag/hd-assets-v1" target="_blank" rel="noopener">Télécharger exports HD ↗</a>
    </div>
    <div class="meta" id="stats">Chargement…</div>

    <div class="panel">
      <div class="row" style="margin-bottom:10px">
        <button class="btn active" data-class="brand_visual">Brand</button>
        <input id="search" class="input" placeholder="Rechercher tweet_, URL, note..." />
        <label class="meta"><input id="onlyHigh" type="checkbox" /> conf ≥ 0.60</label>
      </div>
      <div class="row">
        <select id="paletteTemp"><option value="all">Palette temp: all</option><option>warm</option><option>cool</option><option>neutral</option></select>
        <select id="mono"><option value="all">Monochrome: all</option><option value="true">yes</option><option value="false">no</option></select>
        <select id="sat"><option value="all">Saturation: all</option><option>muted</option><option>balanced</option><option>vivid</option></select>
        <select id="contrast"><option value="all">Contrast: all</option><option>low</option><option>medium</option><option>high</option></select>
        <select id="density"><option value="all">Density: all</option><option>airy</option><option>balanced</option><option>dense</option></select>
        <select id="visualMode"><option value="all">Mode: all</option><option>type_logo_likely</option><option>photo_likely</option><option>mixed</option></select>
        <select id="dominant"><option value="all">Dominant color: all</option><option>gray</option><option>red</option><option>orange</option><option>yellow</option><option>green</option><option>cyan</option><option>blue</option><option>purple</option><option>pink</option></select>
        <select id="typo"><option value="all">Typography: all</option><option>serif</option><option>sans</option><option>mixed</option><option>display</option><option>no_typo</option><option>unknown</option></select>
        <select id="author"><option value="all">Author: all</option></select>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const BUILD = '1782467000';
    const TAGS_PATH = `./analysis/visual_tags.json?v=${BUILD}`;
    const ITEMS_PATH = `./meta/items.json?v=${BUILD}`;

    let allItems = [];
    let activeClass = 'brand_visual';
    const itemMetaByFile = new Map();

    const el = (id) => document.getElementById(id);
    const grid = el('grid');
    const stats = el('stats');

    const controls = {
      search: el('search'),
      onlyHigh: el('onlyHigh'),
      paletteTemp: el('paletteTemp'),
      mono: el('mono'),
      sat: el('sat'),
      contrast: el('contrast'),
      density: el('density'),
      visualMode: el('visualMode'),
      dominant: el('dominant'),
      typo: el('typo'),
      author: el('author')
    };

    function tweetUrlFromFile(file) {
      const match = String(file || '').match(/tweet_(\d+)\.png/);
      return match ? `https://x.com/i/web/status/${match[1]}` : '#';
    }

    function basename(path) {
      return String(path || '').split('/').pop() || '';
    }

    function normalizeMetaItem(raw) {
      const explicitFile = typeof raw.file === 'string' && raw.file.trim() ? raw.file.trim() : '';
      const keptFile = typeof raw.kept === 'string' && raw.kept.trim() ? raw.kept.trim() : '';
      const imageFile = typeof raw.image === 'string' && raw.image.trim() ? basename(raw.image.trim()) : '';
      const file = explicitFile || keptFile || imageFile;
      if (!file) return null;
      return {
        file,
        url: typeof raw.url === 'string' && raw.url.trim() ? raw.url.trim() : tweetUrlFromFile(file),
        text: typeof raw.text === 'string' ? raw.text.trim() : ''
      };
    }

    function itemMeta(it) {
      return itemMetaByFile.get(it.file) || {};
    }

    function itemUrl(it) {
      return itemMeta(it).url || tweetUrlFromFile(it.file);
    }

    function itemText(it) {
      return itemMeta(it).text || '';
    }

    function itemLinkLabel(it) {
      const url = itemUrl(it);
      return /x\.com|twitter\.com/.test(url) ? 'ouvrir tweet ↗' : 'ouvrir source ↗';
    }

    function visible(it) {
      const q = controls.search.value.trim().toLowerCase();
      if (activeClass !== 'all' && it.class !== activeClass) return false;
      if (controls.onlyHigh.checked && (Number(it.confidence) || 0) < 0.6) return false;
      if (q) {
        const haystack = [it.file, itemUrl(it), itemText(it), it.author_handle || ''].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      const authorFilter = controls.author.value;
      if (authorFilter !== 'all' && (it.author_handle || 'unknown') !== authorFilter) return false;

      const paletteTemp = it.palette_temperature_v2 || it.palette_temperature;
      const dominantColor = it.dominant_color_v2 || it.dominant_color;
      const typoPrimary = it.typo_primary_v3 || it.typo_primary_v2 || 'unknown';

      if (controls.paletteTemp.value !== 'all' && paletteTemp !== controls.paletteTemp.value) return false;
      if (controls.mono.value !== 'all' && String(it.monochrome) !== controls.mono.value) return false;
      if (controls.sat.value !== 'all' && it.saturation_level !== controls.sat.value) return false;
      if (controls.contrast.value !== 'all' && it.contrast_level !== controls.contrast.value) return false;
      if (controls.density.value !== 'all' && it.composition_density !== controls.density.value) return false;
      if (controls.visualMode.value !== 'all' && it.visual_mode !== controls.visualMode.value) return false;
      if (controls.dominant.value !== 'all' && dominantColor !== controls.dominant.value) return false;
      if (controls.typo.value !== 'all' && typoPrimary !== controls.typo.value) return false;
      return true;
    }

    function render() {
      const shown = allItems.filter(visible);
      const authorFilter = controls.author.value;
      stats.textContent = `Total brand ${allItems.length} | affichés ${shown.length}${authorFilter !== 'all' ? ` | author: ${authorFilter}` : ''}`;

      grid.innerHTML = shown.map((it) => {
        const dominant = it.dominant_color_v2 || it.dominant_color || 'gray';
        const paletteTemp = it.palette_temperature_v2 || it.palette_temperature || 'neutral';
        const typo = it.typo_primary_v3 || it.typo_primary_v2 || 'unknown';
        const typoCase = it.typo_case_v3 || it.typo_case_v2 || 'unknown';
        const typoPresent = typeof it.typo_present_v3 === 'boolean' ? it.typo_present_v3 : null;
        const typoConfV3 = Number(it.typo_confidence_v3 || 0);
        const domRatio = Number(it.dominant_ratio_v2 || 0);
        const note = itemText(it);

        return `
        <div class="card">
          <div class="imgbox"><img loading="lazy" src="${it.thumb_v2 || it.thumb_data || ('./clean/' + it.file)}" alt="${it.file}" onerror="this.style.opacity=.2" /></div>
          <div class="content">
            <div class="file" title="${it.file}">${it.file}</div>
            <div class="file subtle">@${it.author_handle || 'unknown'}</div>
            <div class="chips">
              <span class="chip">${it.class}</span>
              <span class="chip">conf ${Number(it.confidence || 0).toFixed(2)}</span>
              <span class="chip">${dominant}</span>
              <span class="chip">${paletteTemp}</span>
              <span class="chip">dom ${(domRatio * 100).toFixed(0)}%</span>
              <span class="chip">${it.monochrome ? 'mono' : 'color'}</span>
              <span class="chip">${it.saturation_level}</span>
              <span class="chip">${it.contrast_level}</span>
              <span class="chip">${it.composition_density}</span>
              <span class="chip">${it.visual_mode}</span>
              <span class="chip">typo_present ${typoPresent === null ? 'n/a' : (typoPresent ? 'yes' : 'no')}</span>
              <span class="chip">typo_v3 ${typo}</span>
              <span class="chip">case_v3 ${typoCase}</span>
              <span class="chip">typo_conf_v3 ${typoConfV3.toFixed(2)}</span>
            </div>
            ${note ? `<div class="text-preview" title="${note.replace(/"/g, '&quot;')}">${note}</div>` : ''}
            <div style="margin-top:8px; display:flex; gap:10px; flex-wrap:wrap;">
              <a href="${itemUrl(it)}" target="_blank" rel="noopener">${itemLinkLabel(it)}</a>
              <a href="https://github.com/scarlettbenisen-stack/brand-repo-v2-quotilol-1000-y2024plus/releases/tag/hd-assets-v1" target="_blank" rel="noopener">HD packs ↗</a>
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    document.querySelectorAll('[data-class]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-class]').forEach((node) => node.classList.remove('active'));
        btn.classList.add('active');
        activeClass = btn.dataset.class;
        render();
      });
    });

    Object.values(controls).forEach((node) => node.addEventListener('input', render));
    Object.values(controls).forEach((node) => node.addEventListener('change', render));

    Promise.all([
      fetch(TAGS_PATH).then((r) => r.json()),
      fetch(ITEMS_PATH).then((r) => r.json()).catch(() => ({ items: [] }))
    ])
      .then(([tagsPayload, itemsPayload]) => {
        (itemsPayload.items || [])
          .map(normalizeMetaItem)
          .filter(Boolean)
          .forEach((entry) => itemMetaByFile.set(entry.file, entry));

        allItems = (tagsPayload.items || []).slice();
        allItems.sort((a, b) => {
          const idA = Number((a.file || '').match(/tweet_(\d+)\.png/)?.[1] || 0);
          const idB = Number((b.file || '').match(/tweet_(\d+)\.png/)?.[1] || 0);
          return idB - idA;
        });

        const authors = [...new Set(allItems.map((it) => it.author_handle || 'unknown'))].sort();
        controls.author.innerHTML = '<option value="all">Author: all</option>' + authors.map((author) =>
          `<option value="${author}">@${author}</option>`
        ).join('');

        render();
      })
      .catch((err) => {
        stats.textContent = 'Erreur chargement données: ' + err;
      });
  </script>
</body>
</html>
